name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Build documentation
        run: |
          xcodebuild docbuild -scheme PageKit -destination 'generic/platform=macOS' \
            -derivedDataPath .build/docs OTHER_DOCC_FLAGS=--warnings-as-errors

      - name: Transform for GitHub Pages
        run: |
          archive=$(find .build/docs -type d -name 'PageKit.doccarchive' | head -n 1)
          xcrun docc process-archive transform-for-static-hosting "$archive" \
            --hosting-base-path PageKit --output-path site
          echo '<meta http-equiv="refresh" content="0; url=documentation/pagekit/">' > site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
